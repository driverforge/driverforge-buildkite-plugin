# git-cliff config for the public mirrors' GitHub Releases.
#
# Lives in the PRIVATE repo's top-level .github/ (NOT under a product subtree), so
# it never syncs to a mirror — the mirrors stay source-only and release-passive.
# The release.yml workflow runs git-cliff with this config against a fresh clone
# of the chosen MIRROR, whose history is already scrubbed of internal refs by the
# outbound Copybara sync, so the generated notes can never leak (DF-###) / (#N) /
# co-author trailers.
#
# Group names are prefixed with an HTML comment (<!-- N -->) purely to control
# ordering: git-cliff sorts groups as strings, and the comment renders invisibly
# on GitHub. The visible heading is the text after it.

[changelog]
# No header/footer — the workflow consumes the body as a release-notes fragment
# and prepends nothing. The compare link is appended by the workflow when a
# previous tag exists (avoids git-cliff's null-previous edge on the first cut).
header = ""
# `commit.message` is the clean description for conventional commits, but the
# RAW full message (subject + body + trailers) for non-conventional ones — so
# take the first line only, else a body trailer like GitOrigin-RevId leaks in.
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}\
- {% if commit.breaking %}**BREAKING:** {% endif %}{{ commit.message | split(pat="\\n") | first | upper_first }} ({{ commit.id | truncate(length=7, end="") }})
{% endfor %}\
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
# Keep non-conventional commits (e.g. the seeded snapshot, external-contributor
# commits) — they fall through to the "Other" group rather than being dropped.
filter_unconventional = false
filter_commits = false
# Never drop a breaking change even if its type is in the skip list below.
protect_breaking_commits = true
# Only our release tags define the boundaries between changelog sections.
tag_pattern = "v[0-9].*"

commit_parsers = [
  # Mechanical sync commit from seeding the mirror — not a user-facing change.
  { message = "^Project import generated by Copybara", skip = true },
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactor" },
  { message = "^docs", group = "<!-- 4 -->Documentation" },
  { message = "^tweak", group = "<!-- 5 -->Tweaks" },
  # Internal-only noise — excluded from the public changelog.
  { message = "^chore", skip = true },
  { message = "^ci", skip = true },
  { message = "^build", skip = true },
  { message = "^test", skip = true },
  { message = "^style", skip = true },
  # Anything else still surfaces so nothing meaningful is lost.
  { message = ".*", group = "<!-- 9 -->Other" },
]
